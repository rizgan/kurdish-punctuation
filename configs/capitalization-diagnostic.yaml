# Small diagnostic subset — inspect labels before full training.
project:
  seed: 42
  output_dir: outputs/capitalization-xlm-r-base-diagnostic

model:
  name: FacebookAI/xlm-roberta-base
  max_length: 256
  num_labels: 3

dataset:
  sample_mode: continuous_token_windows
  map_ellipsis_to_period: true
  max_model_length: 256
  min_tokens_per_window: 80
  target_tokens_min: 110
  target_tokens_max: 180
  train_overlap_tokens: 8
  val_overlap_tokens: 0
  test_overlap_tokens: 0
  train_ratio: 0.90
  validation_ratio: 0.05
  test_ratio: 0.05
  seed: 42
  max_articles: 800
  max_train_words: 500_000

sentence_rule:
  capitalize_first_word: true
  capitalize_after_period: true
  capitalize_after_question: true
  capitalize_after_exclamation: true
  skip_leading_quotes: true
  capitalize_word_after_leading_number: false

training:
  precision: bf16
  epochs: 2
  train_batch_size: 16
  eval_batch_size: 32
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  max_grad_norm: 1.0
  logging_steps: 25
  evaluation_strategy: epoch
  save_strategy: epoch
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: capitalization_macro_f1
  greater_is_better: true
  dataloader_num_workers: 0
  gradient_checkpointing: false

loss:
  use_class_weights: true
  class_weight_method: inverse_sqrt
  max_class_weight: 10.0

early_stopping:
  enabled: true
  patience: 2

inference:
  max_length: 256
  overlap_words: 32
  batch_size: 16
  minimum_confidence:
    TITLE: 0.80
    UPPER: 0.90

paths:
  raw_wikipedia_jsonl: data/raw/wikipedia.jsonl
  processed_dir: data/processed_capitalization_diagnostic
  best_model_dir: outputs/capitalization-xlm-r-base-diagnostic/best
