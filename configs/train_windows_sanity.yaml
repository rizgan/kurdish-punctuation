project:
  seed: 42
  output_dir: outputs/punctuation-xlm-r-base-windows-sanity

model:
  name: FacebookAI/xlm-roberta-base
  max_length: 256
  num_labels: 5

dataset:
  sample_mode: continuous_word_windows
  map_ellipsis_to_period: true
  max_model_length: 256
  min_words_per_window: 80
  target_words_min: 110
  target_words_max: 180
  train_overlap_words: 8
  val_overlap_words: 0
  test_overlap_words: 0
  ignore_left_edge_words: 2
  ignore_right_edge_words: 4
  seed: 42

training:
  precision: bf16
  epochs: 1
  train_batch_size: 8
  eval_batch_size: 16
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  max_grad_norm: 1.0
  logging_steps: 20
  evaluation_strategy: epoch
  save_strategy: epoch
  save_total_limit: 1
  load_best_model_at_end: true
  metric_for_best_model: punctuation_macro_f1
  greater_is_better: true
  dataloader_num_workers: 0
  gradient_checkpointing: false

loss:
  use_class_weights: true
  class_weight_method: inverse_sqrt
  max_class_weight: 8.0

early_stopping:
  enabled: false

inference:
  max_length: 256
  overlap_words: 32
  batch_size: 16
  minimum_confidence:
    COMMA: 0.55
    PERIOD: 0.55
    QUESTION: 0.50
    EXCLAMATION: 0.60

paths:
  processed_dir: data/processed_sanity
  best_model_dir: outputs/punctuation-xlm-r-base-windows-sanity/best
