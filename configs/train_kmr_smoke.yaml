# Small/CPU-friendly smoke run to validate the pipeline when the 4090 is busy.
# For real quality use configs/train_kmr.yaml on a free GPU.

base_model: oliverguhr/fullstop-punctuation-multilingual-sonar-base
output_dir: checkpoints/kmr-fullstop
train_file: data/processed/train.jsonl
dev_file: data/processed/dev.jsonl
test_file: data/processed/test.jsonl

num_train_epochs: 1
per_device_train_batch_size: 4
per_device_eval_batch_size: 8
gradient_accumulation_steps: 4
learning_rate: 3.0e-5
weight_decay: 0.01
warmup_ratio: 0.06
max_length: 128
fp16: false
gradient_checkpointing: true
dataloader_num_workers: 0
logging_steps: 20
eval_strategy: steps
eval_steps: 200
save_strategy: steps
save_steps: 200
load_best_model_at_end: true
metric_for_best_model: f1
greater_is_better: true
seed: 42
push_to_hub: false
hub_model_id: null
hub_private: true
